name: Lotto Weekly Bot

on:
  schedule:
    # 한국 시간 토요일 밤 10시 (UTC 13:00)
    - cron: '0 13 * * 6'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-lotto-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 최신 버전 유지
      
    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 버전 유지
      with:
        python-version: '3.12'  # 최신 버전 유지
        
    - name: Install libraries
      run: |
        # 웹 스크래핑(beautifulsoup4)과 최신 Firestore 필터링을 위한 라이브러리 추가
        pip install firebase-admin requests beautifulsoup4 google-cloud-firestore
        
    - name: Create Account Key File
      env:
        # 깃허브 비밀키를 환경 변수로 가져옴
        FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
      run: |
        # 키 내용이 비어있는지 확인하고 파일 생성
        if [ -z "$FIREBASE_KEY" ]; then
          echo "Error: FIREBASE_KEY is empty!"
          exit 1
        fi
        echo "$FIREBASE_KEY" > serviceAccountKey.json

    - name: Run Bot Script
      run: python lotto_bot.py
